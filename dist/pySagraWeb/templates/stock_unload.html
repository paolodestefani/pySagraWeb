<!doctype html>
<html lang="it">
  <head>
    <title>pySagraWeb</title>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="10"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="static/pySagra.png">
    <link rel="stylesheet" media="screen" href="static/css/bootstrap.min.css">
    <script src="static/js/jquery-3.4.1.min.js"></script>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/bootstrap-input-spinner.js"></script>
    <script src="static/js/easy.qrcode.js"></script>
  </head>
  <body>
<div class="jumbotron jumbotron-fluid text-center">
  <h1>Elenco consumi per articoli monitorati</h1>
  <h6>Data: {{date}} - {{day_part}} </h6>
</div>

<div class="container">
<div class="row align-items-center justify-content-center">
<div class="col-md-6">

<!-- main table form -->
  <form action="" method="post">
  <table class="table table-striped table-sm table-bordered">
    <thead class="thead-dark">
      <tr>
        <th>Articolo</th>
        <th class="text-center">Quantit&agrave;</th>
      </tr>
    <thead>
    <tbody>
      {% for line in lines %}
      <tr>
        <td class="text-left">{{ line[0] }}</td>
        <td class="text-right">{{ line[1] }}</td>
      </tr>
      {% endfor %}
    </tbody>
    </table>
  </form>
  <br>
</div>
<br>
</div>
</div>
</body>
</html>
