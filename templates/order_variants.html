{% extends "base.html" %}
{% block content %}
<div class="container-fluid text-sm-center p-3 bg-primary text-white mb-4 bg-gradient">
  <h1>Selezionare la variante</h1>
  <p>{{ test }}</p>
</div>

<div class="container pb-5">
<div class="row align-items-center justify-content-center">
<div class="col-sm-auto">
  <p>{{ item }}:</p>
  <form action="" method="post">
  <div style="padding-left: 4em; margin-bottom: 1em;">
  {% for var in variants %}
  <div class="form-check form-lg">
    <input class="form-check-input" type="checkbox" value="{{ loop.index0 }}" id="cb{{ loop.index0 }}" name="variantschecks">
    <label class="form-check-label" for="cb{{ loop.index0 }}">{{ var[0] }}</label>
    <label class="form-check-label" for="cb{{ loop.index0 }}">{{ var[2] }}</label>
  </div>
  {% endfor %}
  </div>
  <div class="row mb-3">
    <label for="quantity" class="col-sm-auto col-form-label fw-bold">Quantit&agrave;</label>
    <div class="col-sm-auto">
      <input type="number" name="quantity" id="quantity" class="form-control" min="1" max = "99" value="{{ quantity }}">
    </div>
  </div>
  <div class="form-group text-center">
    <button type="submit" class="btn btn-warning" name="cancel">Annulla</button>
    <button type="submit" class="btn btn-success" name="confirm">Conferma</button>
  </div>
  </form>
</div>
</div>
</div>
<script type="module">
    import {InputSpinner} from "{{ url_for("static", filename="js/InputSpinner.js") }}"

    const inputSpinnerElements = document.querySelectorAll("input[type='number']")
    for (const inputSpinnerElement of inputSpinnerElements) {
        new InputSpinner(inputSpinnerElement)
    }
</script>
{% endblock %}
