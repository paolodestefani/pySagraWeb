{% extends "base.html" %}
{% block content %}
<style>
    .form-check-input:not(:checked) {
    border: 1pt solid black; /* checkbox more readable */
}
</style>
<!-- Il wrapper principale occupa l'altezza della viewport dinamica e blocca l'overflow esterno -->
<div class="d-flex flex-column" style="height: 100dvh; overflow: hidden;">

  <!-- blue header (fixed on top) -->
  <div class="container-fluid text-sm-center p-3 bg-primary text-white mb-4 bg-gradient flex-shrink-0">
    <h1>Selezionare la variante</h1>
    <p class="mb-0">{{ test }}</p>
  </div>

  <!-- main container -->
  <div class="container-fluid px-1 flex-grow-1 overflow-hidden d-flex flex-column">
    <!-- row con justify-content-center centra orizzontalmente -->
    <div class="row justify-content-center flex-grow-1 overflow-hidden">
      <!-- Cambiato col-auto in classi col standard per garantire stabilità su mobile ed evitare che i tasti si stringano troppo -->
      <div class="col-12 col-sm-8 col-md-6 d-flex flex-column h-100 overflow-hidden">
        
        <p class="fw-bold mb-2">{{ item }}:</p>
        
        <!-- Il form distribuisce lo spazio in modo fluido e compatto -->
        <form action="" method="post" class="d-flex flex-column flex-grow-1 h-100 overflow-hidden">
          
          <!-- OPTIONS CONTAINER: flex-grow-1 e overflow-auto gestiscono lo scroll se ci sono molte varianti -->
          <div class="overflow-auto pe-1 flex-grow-1">
            <div class="ps-4 mb-4">
              {% for var in variants %}
              <div class="form-check form-lg mb-2">
                <input class="form-check-input" type="checkbox" value="{{ loop.index0 }}" id="cb{{ loop.index0 }}" name="variantschecks">
                <label class="form-check-label me-2" for="cb{{ loop.index0 }}">{{ var.description }}</label>
                <label class="form-check-label text-muted" for="cb{{ loop.index0 }}">{{ var.price_string }}</label>
              </div>
              {% endfor %}
            </div>
            
            <div class="row align-items-center mb-3 mx-0">
              <label for="quantity" class="col-auto col-form-label fw-bold">Quantit&agrave;</label>
              <div class="col-auto">
                <input type="number" name="quantity" id="quantity" class="form-control" min="1" max="99" value="{{ quantity }}">
              </div>
            </div>
          </div>

          <!-- navigation buttons: flex-shrink-0 e pb-3 ancorano i tasti al fondo reale dello schermo mobile -->
          <div class="form-group pb-3 flex-shrink-0 text-center">
            <button type="submit" class="btn btn-warning fw-bold shadow-sm" name="cancel">Annulla</button>
            <button type="submit" class="btn btn-success fw-bold shadow-sm" name="confirm">Conferma</button>
          </div>
          
        </form>

      </div>
    </div>
  </div>

</div>

<script type="module">
    import {InputSpinner} from "{{ url_for("static", filename="js/InputSpinner.js") }}"

    const inputSpinnerElements = document.querySelectorAll("input[type='number']")
    for (const inputSpinnerElement of inputSpinnerElements) {
        new InputSpinner(inputSpinnerElement)
    }
</script>
<script>
  // Gestisce TUTTI gli input attuali e futuri con una sola funzione
  document.addEventListener('input', function (e) {
    if (e.target.classList.contains('bg-change-zero')) {
      const valore = parseFloat(e.target.value);
      
      if (valore !== 0 && !isNaN(valore)) {
        e.target.classList.add('bg-info-subtle', 'border-primary', 'border-3');
      } else {
        e.target.classList.remove('bg-info-subtle', 'border-primary', 'border-3');
      }
    }
  });

  // Esegue il controllo iniziale su tutti gli input al caricamento della pagina
  document.querySelectorAll('.bg-change-zero').forEach(input => {
    const valore = parseFloat(input.value);
    if (valore !== 0 && !isNaN(valore)) input.classList.add('bg-info-subtle', 'border-primary', 'border-3');
  });
</script>
{% endblock %}
