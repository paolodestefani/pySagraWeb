{% extends "base.html" %}
{% block content %}
<div class="d-flex flex-column" style="height: 100dvh; overflow: hidden;">
  <!-- blue header (fixed at top) -->
  <div class="container-fluid text-sm-center p-3 bg-primary text-white mb-4 bg-gradient flex-shrink-0">
    <h1>{{ event }}</h1>
    <p class="mb-1">Compila il modulo seguente per inserire un ordine web. Clicca su <strong>Menu</strong> per selezionare gli articoli. Clicca su <strong>Cancella</strong> per eliminare tutti i dati inseriti.</p>
    <p class="mb-0">{{ test }}</p>
  </div>
  <!-- main container -->
  <div class="container-fluid px-1 flex-grow-1 overflow-hidden d-flex flex-column">
    <div class="row align-items-start justify-content-center flex-grow-1 overflow-hidden">
      <div class="col-12 col-sm-8 col-md-6 d-flex flex-column h-100 overflow-hidden">
        <form action="" method="post" class="d-flex flex-column flex-grow-1 h-100 overflow-hidden">
          <!-- INPUT FIELD CONTAINER: -->
          <div class="pe-1 flex-grow-1 overflow-y-auto overflow-x-hidden">
            <!-- delivery -->
            <div class="row mb-3 mx-0">
              <label for="delivery" class="col-sm-2 col-form-label fw-bold">Consegna</label>
              <div class="col-sm-10">
              <select class="form-control" 
                    name="delivery" 
                    id="delivery" 
                    data-bs-toggle="tooltip" 
                    data-bs-placement="top" 
                    title="Selezionare il tipo di consegna degli articoli tra Tavolo e Asporto">
                {% if delivery == 'Tavolo': %}
                <option selected>Tavolo</option>
                {% else %}
                <option>Tavolo</option>
                {% endif %}
                {% if delivery == 'Asporto': %}
                <option selected>Asporto</option>
                {% else %}
                <option>Asporto</option>
                {% endif %}
              </select>
              </div>
            </div>
            <!-- table number -->
            <div class="row mb-3 mx-0">
              <label for="table"  class="col-sm-2 col-form-label fw-bold">Tavolo</label>
              <div class="col-sm-10">
              <input type="text" 
                    class="form-control"
                    name="table" 
                    id="table"  
                    size="40" 
                    value="{{ table }}" 
                    placeholder="Inserire il numero del tavolo" 
                    maxlength="40" 
                    data-bs-toggle="tooltip" 
                    data-bs-placement="top" 
                    title="Il numero del tavolo &egrave; obbligatorio se la consegna è al Tavolo">
              </div>
            </div>
            <!-- customer name -->
            <div class="row mb-3 mx-0">
              <label for="customer" class="col-sm-2 col-form-label fw-bold">Nome</label>
              <div class="col-sm-10">
              <input type="text" 
                    class="form-control" 
                    name="customer" 
                    id="customer" 
                    size="40" 
                    value="{{ customer }}" 
                    placeholder="Inserire il nome del cliente" 
                    maxlength="40"
                    data-bs-toggle="tooltip" 
                    data-bs-placement="top" 
                    title="Il nome del cliente &egrave; obbligatorio se l'ordine &egrave; per Asporto">
              </div>
            </div>
            <!-- covers number -->
            <div class="row mb-3 mx-0">
              <label for="covers" class="col-sm-2 col-form-label fw-bold">Coperti</label>
                <div class="col-sm-10">
                   <div class="input-group w-100 custom-spinner">
                     <!-- minus button -->
                     <button type="button" 
                            class="btn btn-outline-secondary" 
                            onclick="let inp = this.parentNode.querySelector('input[type=number]'); inp.stepDown(); inp.dispatchEvent(new Event('input', {bubbles: true}));">
                         -
                     </button>
                     <!-- input number -->
                     <input class="form-control text-center bg-white" 
                            type="number" 
                            min="0" 
                            max="99" 
                            step="1" 
                            name="covers" 
                            id="covers" 
                            value="{{ covers }}" 
                            placeholder="Inserire il numero di coperti"
                            title="Il numero di coperti &egrave; obbligatorio solo per la consegna al Tavolo">
                     <!-- plus button -->
                     <button  type="button"
                            class="btn btn-outline-secondary" 
                            onclick="let inp = this.parentNode.querySelector('input[type=number]'); inp.stepUp(); inp.dispatchEvent(new Event('input', {bubbles: true}));">
                         +
                     </button>
                   </div>
                </div>
            </div>
          </div>
         <!-- navigation buttons -->
        <div class="form-group pb-3 flex-shrink-0 text-center">
            <button type="submit" class="btn btn-danger fw-bold shadow-sm" name="reset" title="Elimina tutti i dati e le selezioni effettuate">Cancella</button>
            <button type="submit" class="btn btn-success fw-bold shadow-sm" name="menu" title="Passa alla selezione degli articoli">Menu</button>
        </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
