{% extends "base.html" %}

{% block content %}
<style>
    html, body { 
        background-color: #121212 !important; 
        background-image: none !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
    }
    .container-monitor {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #121212 !important;
    }
    .display-numero { 
        font-size: 35vw; 
        font-weight: 900; 
        line-height: 1; 
        font-family: sans-serif; 
    }
</style>

<div class="container-monitor">
    <!-- htmx interroga la rotta ogni 2 secondi e sostituisce solo il contenuto della card -->
    <div id="qms-monitor" 
         hx-get="{{ url_for('qms.ottieni_card') }}" 
         hx-trigger="every 2s" 
         hx-swap="innerHTML"
         class="w-100 d-flex justify-content-center">
        
        <!-- CARD BOOTSTRAP INIZIALE -->
        <div class="card text-center bg-dark text-white border-primary shadow-lg col-11 col-md-8">
            <div class="card-header bg-primary text-uppercase fw-bold fs-3">
                STIAMO SERVENDO IL NUMERO
            </div>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 70vh;">
                <h1 class="display-numero m-0">{{ numero }}</h1>
            </div>
        </div>

    </div>
</div>
{% endblock %}
