{% extends "base.html" %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="text-center w-100" style="max-width: 500px;">
        <h2 class="mb-5 text-dark fw-bold text-uppercase tracking-wider">Gestione Coda Sagra</h2>
        
        <!-- PULSANTE PRINCIPALE: AVANZA -->
        <div class="mb-4">
            <button hx-post="{{ url_for('qms.avanza_coda') }}" 
                    class="btn btn-success btn-lg w-100 py-4 fs-1 shadow-lg border-2 fw-bold text-uppercase">
                Prossimo Numero
            </button>
        </div>

        <!-- PULSANTI SECONDARI DI SERVIZIO -->
        <div class="row g-3">
            <div class="col-6">
                <!-- REGREDISCI (-1) -->
                <button hx-post="{{ url_for('qms.regredisci_coda') }}" 
                        class="btn btn-warning btn-lg w-100 py-2 fs-5 shadow-sm fw-bold">
                    Decrementa (-1)
                </button>
            </div>
            <div class="col-6">
                <!-- NUOVO TASTO REIMPOSTA / RESET -->
                <button hx-post="{{ url_for('qms.reset_coda') }}" 
                        hx-vals="js:{valore: prompt('Inserisci il nuovo turno (es. A00, B15):', 'A00')}"
                        class="btn btn-danger btn-lg w-100 py-2 fs-5 shadow-sm fw-bold">
                    Reimposta...
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
