{% extends "base.html" %}
{% block content %}
<script src={{ url_for("static", filename="js/htmx.min.js") }}></script>
<div class="container-fluid text-sm-center p-3 bg-primary text-white mb-4 bg-gradient">
  <h2>Ordinato Consegnato</h2>
</div>
<!-- items availability table-->
<div class="container-fluid px-3 pb-4">
  <div class="table-responsive rounded border">
    <table class="table table-sm table-bordered w-100 align-middle border-secondary m-0">
      <thead class="table-dark">
        <tr>
          <th class="text-left" style="width: 50%">Articolo</th>
          <th class="text-center" style="width: 25%">Ordinato</th>
          <th class="text-center" style="width: 25%">Consegnato</th>
        </tr>
      </thead>
      <tbody 
            id="table-body"
            hx-ext="morph"
            hx-get="{{ url_for('monitor.monitor_ordered_delivered_update_rows') }}" 
            hx-trigger="every 5s" 
            hx-target="#table-body" 
            hx-swap="morph">
        {% include "monitor_ordered_delivered_rows.html" %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
